<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面时钟</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0c0e1a 0%, #1a1c2e 50%, #0c0e1a 100%);
      font-family: 'Segoe UI', 'PingFang SC', sans-serif;
      overflow: hidden;
    }

    .clock-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .clock {
      position: relative;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #2a2d42, #1a1c2e 60%, #0f1018);
      box-shadow:
        0 0 60px rgba(100, 120, 255, 0.15),
        inset 0 0 60px rgba(0, 0, 0, 0.5),
        0 0 0 12px #1e2035,
        0 0 0 16px #2a2d50,
        0 0 0 20px #1a1c2e;
    }

    .clock-face {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 370px;
      height: 370px;
      border-radius: 50%;
    }

    /* 刻度 */
    .tick {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      transform-origin: center center;
    }

    .tick::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 14px;
      background: rgba(150, 160, 200, 0.4);
      border-radius: 1px;
    }

    .tick.major::before {
      width: 3px;
      height: 22px;
      background: rgba(200, 210, 255, 0.8);
      box-shadow: 0 0 6px rgba(150, 170, 255, 0.3);
    }

    /* 数字 */
    .number {
      position: absolute;
      font-size: 28px;
      font-weight: 600;
      color: rgba(200, 210, 255, 0.85);
      text-shadow: 0 0 10px rgba(150, 170, 255, 0.3);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .number-12 { top: 22px; left: 50%; transform: translateX(-50%); }
    .number-1  { top: 42px; right: 62px; }
    .number-2  { top: 90px; right: 30px; }
    .number-3  { top: 50%; right: 16px; transform: translateY(-50%); }
    .number-4  { bottom: 90px; right: 30px; }
    .number-5  { bottom: 42px; right: 62px; }
    .number-6  { bottom: 22px; left: 50%; transform: translateX(-50%); }
    .number-7  { bottom: 42px; left: 62px; }
    .number-8  { bottom: 90px; left: 30px; }
    .number-9  { top: 50%; left: 16px; transform: translateY(-50%); }
    .number-10 { top: 90px; left: 30px; }
    .number-11 { top: 42px; left: 62px; }

    /* 中心点 */
    .center-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: radial-gradient(circle, #fff, #8090cc);
      border-radius: 50%;
      z-index: 20;
      box-shadow: 0 0 10px rgba(150, 170, 255, 0.5);
    }

    .center-dot::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background: #1a1c2e;
      border-radius: 50%;
    }

    /* 指针 */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      z-index: 10;
      border-radius: 4px;
    }

    .hour-hand {
      width: 6px;
      height: 100px;
      margin-left: -3px;
      background: linear-gradient(to top, #c8d0ff, #e8ecff);
      box-shadow: 0 0 12px rgba(200, 210, 255, 0.4);
      border-radius: 3px;
      z-index: 12;
    }

    .minute-hand {
      width: 4px;
      height: 135px;
      margin-left: -2px;
      background: linear-gradient(to top, #a0b0ff, #d0d8ff);
      box-shadow: 0 0 10px rgba(160, 180, 255, 0.3);
      border-radius: 2px;
      z-index: 13;
    }

    .second-hand {
      width: 2px;
      height: 150px;
      margin-left: -1px;
      background: linear-gradient(to top, #ff4060, #ff6080);
      box-shadow: 0 0 8px rgba(255, 64, 96, 0.5);
      z-index: 14;
      transition: transform 0.2s cubic-bezier(0.4, 2.08, 0.55, 0.44);
    }

    .second-hand::after {
      content: '';
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 30px;
      background: rgba(255, 64, 96, 0.6);
      border-radius: 1px;
    }

    /* 数字时间显示 */
    .digital-time {
      font-size: 22px;
      font-weight: 300;
      color: rgba(200, 210, 255, 0.7);
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }

    .date-display {
      font-size: 14px;
      color: rgba(150, 160, 200, 0.5);
      letter-spacing: 2px;
    }

    /* 报时提示 */
    .chime-indicator {
      position: fixed;
      top: 30px;
      right: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: rgba(30, 32, 53, 0.9);
      border: 1px solid rgba(100, 120, 255, 0.2);
      border-radius: 30px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.5s ease;
      backdrop-filter: blur(10px);
    }

    .chime-indicator.active {
      opacity: 1;
      transform: translateY(0);
    }

    .chime-indicator .bell-icon {
      font-size: 18px;
      animation: bellSwing 0.5s ease-in-out infinite alternate;
    }

    .chime-indicator .chime-text {
      color: rgba(200, 210, 255, 0.8);
      font-size: 14px;
    }

    @keyframes bellSwing {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }

    /* 状态指示 */
    .status-bar {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .status-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: rgba(150, 160, 200, 0.5);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
    }

    .status-dot.muted {
      background: #f59e0b;
    }

    .status-dot.sleeping {
      background: #ef4444;
    }

    /* 背景装饰 */
    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(80, 100, 255, 0.05), transparent 70%);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ===== 屏保模式 ===== */
    body.screensaver-mode {
      cursor: none;
    }

    body.screensaver-mode .status-bar,
    body.screensaver-mode .digital-time,
    body.screensaver-mode .date-display {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease;
    }

    body.screensaver-mode .chime-indicator {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* 屏保进入倒计时提示 */
    .screensaver-countdown {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 20px;
      background: rgba(30, 32, 53, 0.85);
      border: 1px solid rgba(100, 120, 255, 0.2);
      border-radius: 20px;
      color: rgba(200, 210, 255, 0.6);
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    .screensaver-countdown.visible {
      opacity: 1;
    }

    /* 屏保设置按钮 */
    .screensaver-settings {
      position: fixed;
      top: 30px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: opacity 1.5s ease;
    }

    body.screensaver-mode .screensaver-settings {
      opacity: 0;
      pointer-events: none;
    }

    .screensaver-toggle {
      padding: 6px 16px;
      background: rgba(100, 120, 255, 0.15);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 20px;
      color: rgba(200, 210, 255, 0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .screensaver-toggle:hover {
      background: rgba(100, 120, 255, 0.3);
    }

    .screensaver-toggle.active {
      background: rgba(100, 120, 255, 0.35);
      border-color: rgba(100, 120, 255, 0.6);
    }

    .screensaver-info {
      color: rgba(150, 160, 200, 0.5);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- 屏保设置 -->
  <div class="screensaver-settings">
    <button class="screensaver-toggle active" id="screensaverToggle">🖥 屏保：开启</button>
    <span class="screensaver-info" id="screensaverInfo">无操作 60 秒后进入屏保</span>
  </div>

  <!-- 屏保倒计时提示 -->
  <div class="screensaver-countdown" id="screensaverCountdown"></div>

  <div class="chime-indicator" id="chimeIndicator">
    <span class="bell-icon">🔔</span>
    <span class="chime-text" id="chimeText"></span>
  </div>

  <div class="clock-container">
    <div class="clock">
      <div class="clock-face">
        <!-- 刻度 -->
        <!-- 数字 -->
        <div class="number number-12">12</div>
        <div class="number number-1">1</div>
        <div class="number number-2">2</div>
        <div class="number number-3">3</div>
        <div class="number number-4">4</div>
        <div class="number number-5">5</div>
        <div class="number number-6">6</div>
        <div class="number number-7">7</div>
        <div class="number number-8">8</div>
        <div class="number number-9">9</div>
        <div class="number number-10">10</div>
        <div class="number number-11">11</div>

        <!-- 指针 -->
        <div class="hand hour-hand" id="hourHand"></div>
        <div class="hand minute-hand" id="minuteHand"></div>
        <div class="hand second-hand" id="secondHand"></div>
        <div class="center-dot"></div>
      </div>
    </div>

    <div class="digital-time" id="digitalTime">00:00:00</div>
    <div class="date-display" id="dateDisplay"></div>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">正常</span>
    </div>
    <div class="status-item">
      <span id="chimeStatus">报时：开启 (8:00 - 22:00)</span>
    </div>
    <button id="testChimeBtn" style="
      margin-left: 16px;
      padding: 6px 18px;
      background: rgba(100, 120, 255, 0.15);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 20px;
      color: rgba(200, 210, 255, 0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    " onmouseover="this.style.background='rgba(100,120,255,0.3)'" onmouseout="this.style.background='rgba(100,120,255,0.15)'">
      🔔 测试报时（3声）
    </button>
    <button id="testHalfChimeBtn" style="
      margin-left: 8px;
      padding: 6px 18px;
      background: rgba(100, 120, 255, 0.15);
      border: 1px solid rgba(100, 120, 255, 0.3);
      border-radius: 20px;
      color: rgba(200, 210, 255, 0.8);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s;
    " onmouseover="this.style.background='rgba(100,120,255,0.3)'" onmouseout="this.style.background='rgba(100,120,255,0.15)'">
      🔔 测试半点（1声）
    </button>
  </div>

  <script>
    // ==================== 刻度生成 ====================
    const clockFace = document.querySelector('.clock-face');
    for (let i = 0; i < 60; i++) {
      const tick = document.createElement('div');
      tick.classList.add('tick');
      if (i % 5 === 0) tick.classList.add('major');
      tick.style.transform = `rotate(${i * 6}deg)`;
      clockFace.appendChild(tick);
    }

    // ==================== 时钟走动 ====================
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');
    const digitalTime = document.getElementById('digitalTime');
    const dateDisplay = document.getElementById('dateDisplay');

    let prevSecond = -1;

    function updateClock() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const secondDeg = seconds * 6;
      const minuteDeg = (minutes + seconds / 60) * 6;
      const hourDeg = ((hours % 12) + minutes / 60) * 30;

      // 处理秒针从 59 秒跳回 0 秒时，避免反转动画
      if (prevSecond === 59 && seconds === 0) {
        secondHand.style.transition = 'none';
        secondHand.style.transform = 'rotate(360deg)';
        secondHand.offsetHeight; // 强制重绘
        secondHand.style.transform = 'rotate(0deg)';
        setTimeout(() => {
          secondHand.style.transition = 'transform 0.2s cubic-bezier(0.4, 2.08, 0.55, 0.44)';
        }, 20);
      } else {
        secondHand.style.transform = `rotate(${secondDeg}deg)`;
      }
      prevSecond = seconds;

      minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
      hourHand.style.transform = `rotate(${hourDeg}deg)`;

      // 数字时间
      digitalTime.textContent =
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');

      // 日期
      const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
      dateDisplay.textContent =
        `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${weekDays[now.getDay()]}`;

      // 检查整点报时
      checkChime();

      // 动态计算到下一秒的精确延迟，确保每次都对齐秒边界
      const msToNextSecond = 1000 - now.getMilliseconds();
      setTimeout(updateClock, msToNextSecond);
    }

    // 启动：对齐到下一秒的边界开始
    const msToStart = 1000 - new Date().getMilliseconds();
    setTimeout(updateClock, msToStart);

    // ==================== 整点报时 ====================
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isChiming = false;

    // 系统状态检测
    // 通过 Page Visibility API 检测页面是否隐藏（模拟睡眠状态）
    // 通过 Notification API 检测是否授权通知（模拟勿扰状态）
    function getSystemStatus() {
      const status = {
        isSleeping: false,
        isDoNotDisturb: false,
        label: '正常',
        dotClass: ''
      };

      // 检测页面是否隐藏（系统睡眠/屏幕关闭）
      if (document.hidden || document.visibilityState === 'hidden') {
        status.isSleeping = true;
        status.label = '睡眠中';
        status.dotClass = 'sleeping';
      }

      // 检测通知权限（denied 视为勿扰模式）
      if ('Notification' in window && Notification.permission === 'denied') {
        status.isDoNotDisturb = true;
        status.label = '勿扰模式';
        status.dotClass = 'muted';
      }

      return status;
    }

    function updateStatusDisplay() {
      const status = getSystemStatus();
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      const chimeStatusEl = document.getElementById('chimeStatus');

      dot.className = 'status-dot' + (status.dotClass ? ' ' + status.dotClass : '');
      text.textContent = status.label;

      const now = new Date();
      const h = now.getHours();
      if (h >= 8 && h < 22) {
        if (status.isDoNotDisturb) {
          chimeStatusEl.textContent = '报时：已暂停（' + status.label + '）';
        } else if (audioCtx.state === 'suspended') {
          chimeStatusEl.textContent = '报时：开启 (8:00 - 22:00) · ⚠️ 请点击页面激活声音';
        } else {
          chimeStatusEl.textContent = '报时：开启 (8:00 - 22:00)';
        }
      } else {
        chimeStatusEl.textContent = '报时：休息时段 (22:00 - 8:00)';
      }
    }

    setInterval(updateStatusDisplay, 1000);

    function canChime(hour) {
      // 只在 8:00 - 21:59 报时（即 8 点到 22 点之间的整点）
      if (hour < 8 || hour >= 22) return false;

      // 注意：页面被切到后台（document.hidden）时不再阻止报时，
      // 否则切换标签页就会漏报。仅勿扰模式才静音。
      const status = getSystemStatus();
      if (status.isDoNotDisturb) return false;

      return true;
    }

    // 已报时刻记录（格式：YYYY-M-D-H-0 / YYYY-M-D-H-30），避免重复报时
    let lastChimeKey = null;
    // 容错窗口：整点/半点后 90 秒内都允许补报
    // （Chrome 后台标签页会节流定时器，可能错过 seconds === 0 那一刻）
    const CHIME_CATCHUP_WINDOW = 90;

    function makeChimeKey(d, mark) {
      return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}-${d.getHours()}-${mark}`;
    }

    // 基于绝对时间判断是否该报时，支持错过后补报
    function checkChime() {
      if (isChiming) return;

      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      // 距离本小时整点、半点已过去的秒数
      const secsSinceHour = minutes * 60 + seconds;
      const secsSinceHalf = (minutes - 30) * 60 + seconds;

      // 整点报时（0 ~ 90 秒窗口内）
      if (secsSinceHour >= 0 && secsSinceHour <= CHIME_CATCHUP_WINDOW) {
        const key = makeChimeKey(now, 0);
        if (lastChimeKey !== key) {
          lastChimeKey = key;
          if (canChime(hours)) {
            const chimeCount = hours % 12 === 0 ? 12 : hours % 12;
            if (secsSinceHour > 1) {
              console.log('检测到错过整点报时，补报（延迟', secsSinceHour, '秒）');
            }
            playChime(chimeCount, hours);
          }
        }
        return;
      }

      // 半点报时（30分 ~ 30分90秒窗口内，音量60%）
      if (secsSinceHalf >= 0 && secsSinceHalf <= CHIME_CATCHUP_WINDOW) {
        const key = makeChimeKey(now, 30);
        if (lastChimeKey !== key) {
          lastChimeKey = key;
          if (canChime(hours)) {
            if (secsSinceHalf > 1) {
              console.log('检测到错过半点报时，补报（延迟', secsSinceHalf, '秒）');
            }
            playHalfChime(hours);
          }
        }
      }
    }

    // ==================== 真实座钟音效 ====================
    // 过渡音.mp3：过渡旋律
    // 敲钟.mp3：单次敲钟声

    const MELODY_FILE = '过渡音.mp3';
    const STRIKE_FILE = '敲钟.mp3';
    let melodyBuffer = null;
    let strikeBuffer = null;
    let halfStrikeBuffer = null; // 半点专用：预渲染的带衰减钟声（音量60%）
    let lastStrikeBuffer = null; // 整点最后一声专用：预渲染的带衰减钟声（音量100%）
    let audioLoaded = false;

    // 预渲染带衰减的钟声音频（单次敲击 + 自然衰减到0）
    // vol: 起始音量（半点0.6，整点1.0）
    function renderFadedStrikeBuffer(srcBuffer, vol) {
      const sampleRate = srcBuffer.sampleRate;
      const channels = srcBuffer.numberOfChannels;
      const srcDur = srcBuffer.duration;
      const totalDur = srcDur + 8;
      const totalFrames = Math.ceil(totalDur * sampleRate);
      const srcFrames = srcBuffer.length;

      const outBuffer = new AudioBuffer({
        numberOfChannels: channels,
        length: totalFrames,
        sampleRate: sampleRate
      });

      for (let ch = 0; ch < channels; ch++) {
        const srcData = srcBuffer.getChannelData(ch);
        const outData = outBuffer.getChannelData(ch);
        for (let i = 0; i < srcFrames && i < totalFrames; i++) {
          outData[i] = srcData[i];
        }
      }

      for (let ch = 0; ch < channels; ch++) {
        const outData = outBuffer.getChannelData(ch);
        for (let i = 0; i < totalFrames; i++) {
          const t = i / (totalFrames - 1);
          const gain = vol * Math.pow(1 - t, 1.5);
          outData[i] *= gain;
        }
      }

      return outBuffer;
    }

    // 预加载两个音频文件，然后渲染半点专用音频
    Promise.all([
      fetch(MELODY_FILE).then(r => r.arrayBuffer()).then(buf => audioCtx.decodeAudioData(buf)),
      fetch(STRIKE_FILE).then(r => r.arrayBuffer()).then(buf => audioCtx.decodeAudioData(buf))
    ]).then(([mBuf, sBuf]) => {
      melodyBuffer = mBuf;
      strikeBuffer = sBuf;
      console.log('音频加载完成 - 过渡音:', mBuf.duration.toFixed(2), '秒, 敲钟:', sBuf.duration.toFixed(2), '秒');
      // 预渲染半点专用音频（音量60%）和整点最后一声专用音频（音量100%）
      halfStrikeBuffer = renderFadedStrikeBuffer(sBuf, 0.6);
      lastStrikeBuffer = renderFadedStrikeBuffer(sBuf, 1.0);
      audioLoaded = true;
      console.log('预渲染音频完成 - 半点:', halfStrikeBuffer.duration.toFixed(2), '秒, 最后一声:', lastStrikeBuffer.duration.toFixed(2), '秒');
    }).catch(err => {
      console.error('音频加载失败:', err);
    });

    // 立即播放一次过渡旋律（返回时长）
    function playMelodyNow(vol) {
      if (!melodyBuffer) return 0;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      source.buffer = melodyBuffer;
      gainNode.gain.value = vol;
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      source.start(0);
      return melodyBuffer.duration;
    }

    // 重叠时间（秒）
    const STRIKE_OVERLAP = 0.4;

    // 用 Web Audio API 精确调度播放敲钟（避免 setTimeout 的延迟抖动）
    function playStrikeAt(when, vol, isLast) {
      if (!strikeBuffer) return;
      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      if (isLast && lastStrikeBuffer) {
        // 最后一声：播放预渲染好的带衰减音频（单次，不循环）
        source.buffer = lastStrikeBuffer;
        gainNode.gain.setValueAtTime(vol, when);
      } else {
        source.buffer = strikeBuffer;
        gainNode.gain.setValueAtTime(vol, when);
      }
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      source.start(when);
    }

    // 整点报时：过渡音 + count 声敲钟
    function playChime(count, hour, vol) {
      isChiming = true;
      const volume = vol || 1.0;

      const indicator = document.getElementById('chimeIndicator');
      const chimeText = document.getElementById('chimeText');

      const hourDisplay = hour > 12 ? `下午${hour - 12}` : (hour === 12 ? '中午12' : `上午${hour}`);
      chimeText.textContent = `${hourDisplay}点 · 报时${count}声`;
      indicator.classList.add('active');

      if (!audioLoaded) {
        console.warn('音频尚未加载完成');
        isChiming = false;
        indicator.classList.remove('active');
        return;
      }

      // 第一部分：播放过渡旋律
      const melodyDur = playMelodyNow(volume);

      // 第二部分：用 Web Audio API 精确调度所有敲钟
      // 动态间隔 = 敲钟音频时长 - 重叠时间
      const strikeDur = strikeBuffer.duration;
      const interval = strikeDur - STRIKE_OVERLAP;
      const baseTime = audioCtx.currentTime + melodyDur - 0.1; // 过渡音结束前0.1秒

      for (let i = 0; i < count; i++) {
        const isLast = (i === count - 1);
        playStrikeAt(baseTime + i * interval, volume, isLast);
      }
      console.log('敲钟调度完成, 间隔:', interval.toFixed(2), '秒, 音频时长:', strikeDur.toFixed(2), '秒, 重叠:', STRIKE_OVERLAP, '秒');

      // 报时完成后隐藏提示
      const totalMs = (melodyDur - 0.1 + count * interval + strikeDur + 2) * 1000;
      setTimeout(() => {
        indicator.classList.remove('active');
        isChiming = false;
      }, totalMs);
    }

    // 半点报时：播放预渲染好的带衰减钟声（一次性播放，无循环）
    function playHalfChime(hour) {
      isChiming = true;

      const indicator = document.getElementById('chimeIndicator');
      const chimeText = document.getElementById('chimeText');

      const hourDisplay = hour > 12 ? `下午${hour - 12}` : (hour === 12 ? '中午12' : `上午${hour}`);
      chimeText.textContent = `${hourDisplay}点半 · 半点报时`;
      indicator.classList.add('active');

      if (!audioLoaded || !halfStrikeBuffer) {
        console.warn('音频尚未加载完成');
        isChiming = false;
        indicator.classList.remove('active');
        return;
      }

      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      source.buffer = halfStrikeBuffer;
      source.connect(audioCtx.destination);
      source.start(0);

      console.log('半点报时 - 播放预渲染音频, 时长:', halfStrikeBuffer.duration.toFixed(2), '秒');

      setTimeout(() => {
        indicator.classList.remove('active');
        isChiming = false;
      }, (halfStrikeBuffer.duration + 0.5) * 1000);
    }

    // 请求通知权限（用于检测勿扰状态）
    if ('Notification' in window && Notification.permission === 'default') {
      // 不主动弹出请求，让用户自己决定
    }

    // 页面可见性变化监听
    document.addEventListener('visibilitychange', () => {
      updateStatusDisplay();
      if (!document.hidden) {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        // 切回前台立即检查一次，补报被节流错过的报时
        checkChime();
      }
    });

    // 点击/按键激活音频（Chrome 自动播放策略要求用户手势）
    let audioActivated = false;
    function activateAudio() {
      if (audioActivated) return;
      audioCtx.resume().then(() => {
        audioActivated = true;
        startKeepAlive();
        updateStatusDisplay();
        console.log('音频已激活');
      }).catch(() => {});
    }
    ['click', 'keydown', 'touchstart'].forEach(evt => {
      document.addEventListener(evt, activateAudio, { passive: true });
    });

    // 保活：播放一个音量为 0 的持续静音源。
    // Chrome 不会对"正在播放音频"的标签页做激进的定时器节流，
    // 这样切到后台时时钟和报时检查仍能按秒运行。
    let keepAliveStarted = false;
    function startKeepAlive() {
      if (keepAliveStarted) return;
      keepAliveStarted = true;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      g.gain.value = 0; // 完全静音
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      console.log('音频保活已启动（减少后台节流）');
    }

    // 独立的报时心跳：不依赖时钟渲染循环，每秒独立检查一次
    setInterval(checkChime, 1000);

    // 初始状态更新
    updateStatusDisplay();

    // 测试报时按钮（固定3声）
    document.getElementById('testChimeBtn').addEventListener('click', () => {
      activateAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      startKeepAlive();
      const now = new Date();
      const h = now.getHours();
      playChime(3, h);
    });

    // 测试半点报时按钮（1声，音量60%）
    document.getElementById('testHalfChimeBtn').addEventListener('click', () => {
      activateAudio();
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      startKeepAlive();
      const now = new Date();
      const h = now.getHours();
      playHalfChime(h);
    });

    // ==================== 屏保模式 ====================
    let screensaverEnabled = true;
    const SCREENSAVER_TIMEOUT = 60; // 秒
    const COUNTDOWN_SHOW_AT = 10;   // 最后10秒显示倒计时
    let idleSeconds = 0;
    let isScreensaver = false;

    // 全局主音量节点：所有音频通过此节点输出
    const masterGain = audioCtx.createGain();
    masterGain.gain.value = 1.0;
    masterGain.connect(audioCtx.destination);

    // 重写音频播放函数，将输出连接到 masterGain 而非 audioCtx.destination
    // 覆盖 playMelodyNow
    const _origPlayMelodyNow = playMelodyNow;
    playMelodyNow = function(vol) {
      if (!melodyBuffer) return 0;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      source.buffer = melodyBuffer;
      gainNode.gain.value = vol;
      source.connect(gainNode);
      gainNode.connect(masterGain);
      source.start(0);
      return melodyBuffer.duration;
    };

    // 覆盖 playStrikeAt
    const _origPlayStrikeAt = playStrikeAt;
    playStrikeAt = function(when, vol, isLast) {
      if (!strikeBuffer) return;
      const source = audioCtx.createBufferSource();
      const gainNode = audioCtx.createGain();
      if (isLast && lastStrikeBuffer) {
        source.buffer = lastStrikeBuffer;
        gainNode.gain.setValueAtTime(vol, when);
      } else {
        source.buffer = strikeBuffer;
        gainNode.gain.setValueAtTime(vol, when);
      }
      source.connect(gainNode);
      gainNode.connect(masterGain);
      source.start(when);
    };

    // 覆盖 playHalfChime 中的音频播放（通过修改函数）
    const _origPlayHalfChime = playHalfChime;
    playHalfChime = function(hour) {
      isChiming = true;
      const indicator = document.getElementById('chimeIndicator');
      const chimeText = document.getElementById('chimeText');
      const hourDisplay = hour > 12 ? `下午${hour - 12}` : (hour === 12 ? '中午12' : `上午${hour}`);
      chimeText.textContent = `${hourDisplay}点半 · 半点报时`;
      indicator.classList.add('active');
      if (!audioLoaded || !halfStrikeBuffer) {
        console.warn('音频尚未加载完成');
        isChiming = false;
        indicator.classList.remove('active');
        return;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const source = audioCtx.createBufferSource();
      source.buffer = halfStrikeBuffer;
      source.connect(masterGain);
      source.start(0);
      console.log('半点报时 - 播放预渲染音频, 时长:', halfStrikeBuffer.duration.toFixed(2), '秒');
      setTimeout(() => {
        indicator.classList.remove('active');
        isChiming = false;
      }, (halfStrikeBuffer.duration + 0.5) * 1000);
    };

    const countdownEl = document.getElementById('screensaverCountdown');
    const toggleBtn = document.getElementById('screensaverToggle');
    const infoEl = document.getElementById('screensaverInfo');

    function enterScreensaver() {
      if (isScreensaver) return;
      isScreensaver = true;
      document.body.classList.add('screensaver-mode');
      countdownEl.classList.remove('visible');
      // 音量渐变到 50%
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 1.5);
      console.log('进入屏保模式，音量降至 50%');
    }

    function exitScreensaver() {
      if (!isScreensaver) return;
      isScreensaver = false;
      idleSeconds = 0;
      document.body.classList.remove('screensaver-mode');
      countdownEl.classList.remove('visible');
      // 音量恢复到 100%
      masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
      masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
      masterGain.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.5);
      console.log('退出屏保模式，音量恢复 100%');
    }

    function resetIdle() {
      if (isScreensaver) {
        exitScreensaver();
      }
      idleSeconds = 0;
      countdownEl.classList.remove('visible');
    }

    // 用户活动事件监听
    ['mousemove', 'mousedown', 'keydown', 'touchstart', 'scroll'].forEach(evt => {
      document.addEventListener(evt, resetIdle, { passive: true });
    });

    // 每秒检查空闲时间
    setInterval(() => {
      if (!screensaverEnabled || isScreensaver) return;
      idleSeconds++;
      const remaining = SCREENSAVER_TIMEOUT - idleSeconds;

      if (remaining <= 0) {
        enterScreensaver();
      } else if (remaining <= COUNTDOWN_SHOW_AT) {
        countdownEl.textContent = `${remaining} 秒后进入屏保模式...`;
        countdownEl.classList.add('visible');
      }
    }, 1000);

    // 屏保开关按钮
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      screensaverEnabled = !screensaverEnabled;
      if (screensaverEnabled) {
        toggleBtn.textContent = '🖥 屏保：开启';
        toggleBtn.classList.add('active');
        infoEl.textContent = '无操作 60 秒后进入屏保';
        idleSeconds = 0;
      } else {
        toggleBtn.textContent = '🖥 屏保：关闭';
        toggleBtn.classList.remove('active');
        infoEl.textContent = '';
        exitScreensaver();
        countdownEl.classList.remove('visible');
      }
    });
  </script>
</body>
